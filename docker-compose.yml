version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apartment_backend
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Database__Provider=Postgres
      - Database__Schema=proptech
      - ConnectionStrings__DefaultConnection=${PROPTECH_DATABASE_URL}
      - Jwt__Key=YourSuperSecretKeyThatIsAtLeast32CharactersLongForHS256Algorithm
      - Jwt__Issuer=ApartmentManagementAPI
      - Jwt__Audience=ApartmentManagementClient
      - Jwt__ExpiryHours=24
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - apartment_network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apartment_frontend
    ports:
      - "3001:3001"
    depends_on:
      - backend
    networks:
      - apartment_network
    restart: unless-stopped

networks:
  apartment_network:
    driver: bridge

volumes:
  backend_uploads:
    driver: local
